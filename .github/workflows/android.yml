
name: Build Fennec Player APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          set +e
          gradle --no-daemon assembleDebug --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "^(e: |w: .*Unresolved|.*error:|.*AAPT|.*What went wrong|> )" build.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            grep -A12 "What went wrong" build.log | head -20 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
          fi
          exit $code

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Fennec-Player-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
